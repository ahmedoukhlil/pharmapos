# À chaque push sur main : connexion SSH au serveur et lancement de deploy.sh.
# Secrets à créer sur GitHub (Settings → Secrets and variables → Actions) :
#   SSH_HOST, SSH_USER, SSH_KEY (clé privée), SSH_PORT (facultatif, 22 par défaut)
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mise à jour du serveur
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          script: bash /var/www/pharmapos/deploy.sh
